name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.tag }}
        run: |
          BUILD_TIME=$(date +%Y%m%d-%H%M)
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
            -o "exchange-${GOOS}-${GOARCH}${EXT}" ./cmd/exchange

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchange-${{ matrix.goos }}-${{ matrix.goarch }}
          path: exchange-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum exchange-* > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            exchange-*
            checksums.txt

  # Publishes the CLI as one signed OCI artifact,
  # ghcr.io/dsswift/cli-exchange:cli-<version>, one layer a file, so an
  # estate's forge can verify and serve it with no GitHub credential. The
  # tag must match VERSION; that file is the source of truth.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed to get an OIDC token for keyless signing.
      id-token: write
    env:
      IMAGE: ghcr.io/dsswift/cli-exchange
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check the tag matches VERSION
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(cut -d' ' -f1 VERSION)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # One file a platform, named so a script picks its own by name.
      - name: Build the CLI
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p cli
          BUILD_TIME=$(date +%Y%m%d-%H%M)
          for target in darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
              -o "cli/exchange-$os-$arch" ./cmd/exchange
          done
          (cd cli && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - name: Push the CLI as an OCI artifact
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd cli
          oras push "${IMAGE}:cli-${VERSION}" \
            --artifact-type application/vnd.dsswift.cli-exchange-cli.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --format go-template='{{.digest}}' \
            exchange-darwin-arm64:application/octet-stream \
            SHA256SUMS:text/plain > ../digest.txt
          echo "digest=$(cat ../digest.txt)" >> "$GITHUB_OUTPUT"
      # Sign and verify by digest, never by tag: a tag can move.
      - name: Sign and verify the CLI
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' > /dev/null
